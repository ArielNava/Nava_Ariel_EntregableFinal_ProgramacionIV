{% extends 'productos/base.html' %}
{% block content %}
<div style="max-width:600px; margin:0 auto; background:#162032; border:1px solid #1e3a5f; border-radius:14px; padding:24px">
<h2>{% if accion == 'Agregar' %}➕{% else %}✏️{% endif %} {{accion}} Producto</h2>
<form method="POST" style="margin-top:16px">{% csrf_token %}
<label style="font-size:12px; font-weight:700">NOMBRE *</label><input name="nombre" value="{{producto.nombre|default:''}}" required style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 12px 0; background:#0b1220; color:white">
<label style="font-size:12px; font-weight:700">📝 DESCRIPCION CORTA</label><textarea name="descripcion" rows="2" placeholder="Ej: Core i7 12va, 16GB RAM, ideal gaming" style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 12px 0; background:#0b1220; color:white">{{producto.descripcion|default:''}}</textarea>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
<div><label style="font-size:12px; font-weight:700">CODIGO</label><input name="codigo" value="{% if producto %}{{producto.codigo}}{% else %}{{codigo_default}}{% endif %}" style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 12px 0; background:#0b1220; color:white"></div>
<div><label style="font-size:12px; font-weight:700">CATEGORIA</label><select name="categoria" style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 12px 0; background:#0b1220; color:white"><option value="computadora">Computadora</option><option value="accesorio">Accesorio</option><option value="componente">Componente</option><option value="periferico">Periferico</option></select></div>
</div>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
<div><label style="font-size:12px; font-weight:700">PRECIO</label><input name="precio" type="number" step="0.01" value="{% if producto %}{{producto.precio}}{% endif %}" required style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 12px 0; background:#0b1220; color:white"></div>
<div><label style="font-size:12px; font-weight:700">CANTIDAD</label><input name="cantidad_existente" type="number" value="{% if producto %}{{producto.cantidad_existente}}{% else %}5{% endif %}" style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 12px 0; background:#0b1220; color:white"></div>
</div>
<label style="font-size:12px; font-weight:700">STOCK MINIMO</label><input name="stock_minimo" type="number" value="{% if producto %}{{producto.stock_minimo}}{% else %}3{% endif %}" style="width:100%; padding:11px; border-radius:8px; border:1px solid #334155; margin:6px 0 16px 0; background:#0b1220; color:white">
<div style="display:flex; gap:10px"><button type="submit" style="flex:1; background:#22c55e; color:white; padding:12px; border-radius:10px; border:none; font-weight:900">💾 Guardar</button><a href="/" style="flex:1; background:#1e293b; border:1px solid #334155; color:white; padding:12px; border-radius:10px; text-align:center; text-decoration:none; font-weight:800">✕ Cancelar</a></div>
</form></div>
{% endblock %}
