{% extends 'productos/base.html' %}
{% block content %}
<div class="card" style="max-width:520px;margin:20px auto">
<h2 style="margin-top:0">{% if edit %}✏️ Editar {{p.nombre}} <br><small style="color:var(--muted)">{{p.codigo}}</small>{% else %}+ Nuevo Producto{% endif %}</h2>
<form method="post">{% csrf_token %}
{% if edit %}<label>Código</label><input value="{{p.codigo}}" disabled style="background:var(--bg)">{% endif %}
<label>Nombre</label><input name="nombre" value="{{p.nombre|default:''}}" required>
<label>Categoría</label><select name="categoria">{% for k,v in categorias %}<option value="{{k}}" {% if p.categoria == k %}selected{% endif %}>{{v}}</option>{% endfor %}</select>
<label>Precio en Bs.</label><input type="number" step="0.01" name="precio" value="{{p.precio|default:''}}" required>
<label>Cantidad Existente</label><input type="number" name="cantidad" value="{{p.cantidad_existente|default:''}}" required>
<label>Stock Mínimo</label><input type="number" name="stock_minimo" value="{{p.stock_minimo|default:3}}">
<button class="btn" style="width:100%;justify-content:center;margin-top:10px">{% if edit %}💾 Actualizar{% else %}💾 Guardar{% endif %}</button>
</form>
<div style="margin-top:18px;text-align:center"><a href="/" class="btn btn-secondary">← Volver al Inventario</a></div>
</div>
{% endblock %}
